name: Release

# Publishing is deliberately manual: push a version tag, and only then does a
# build reach PyPI. Trusted publishing means no API token is stored in the repo.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag $tag does not match pyproject version $packaged" >&2
            exit 1
          fi
      - name: Lint
        run: uv run ruff check src tests
      - name: Run tests
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
