[project]
name = "tracegrad"
version = "0.1.0"
description = "Offline, evidence-gated system-prompt optimization from traces and LLM-judge results"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
tracegrad = "tracegrad.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegrad"]
