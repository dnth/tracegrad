[project]
name = "tracegrad"
version = "0.1.0"
description = "Offline, evidence-gated system-prompt optimization from traces and LLM-judge results"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
kitaru = ["kitaru>=0.22,<0.23"]

[project.scripts]
tracegrad = "tracegrad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
    "harness: opt-in round trip against a real local coding-agent harness",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegrad"]
